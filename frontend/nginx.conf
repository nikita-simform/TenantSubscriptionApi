server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing — a hard refresh/direct link to
    # /resources has no matching file on disk, so nginx must fall back to
    # index.html and let the React app's own router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
